<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色注册器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #141521, #2D2881, #141521);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #CDD3D4, #937562);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.85;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .input-section {
            background: rgba(25, 25, 60, 0.85);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
        
        .output-section {
            background: rgba(30, 30, 50, 0.85);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }
        
        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4EA4EF;
            color: #4EA4EF;
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 500px) {
            .input-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #aaccff;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #2D2881;
            border-radius: 8px;
            background: rgba(20, 20, 40, 0.8);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4EA4EF;
            box-shadow: 0 0 0 3px rgba(255, 153, 102, 0.3);
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .btn-container {
            text-align: center;
            margin: 25px 0;
        }
        
        .generate-btn {
            background: linear-gradient(45deg, #2D2881, #4EA4EF);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .generate-btn:active {
            transform: translateY(1px);
        }
        
        .output-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .output-group {
            background: rgba(20, 20, 40, 0.9);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #4a5b8c;
        }
        
        .output-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #aaccff;
            display: flex;
            align-items: center;
        }
        
        .output-title::before {
            content: "【";
            margin-right: 3px;
        }
        
        .output-title::after {
            content: "】";
            margin-left: 3px;
        }
        
        .output-text {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            background: rgba(10, 10, 20, 0.8);
            color: #e0e0ff;
            border-radius: 8px;
            border: 1px solid #2D2881;
            font-family: 'Consolas', 'Courier New', monospace;
            white-space: pre-wrap;
            overflow: auto;
            line-height: 1.5;
        }
        
        .warning {
            background: rgba(150, 20, 20, 0.3);
            border: 1px solid #ff3333;
            color: #ff9999;
            font-weight: bold;
        }
        
        .warning-title {
            color: #ff6666;
        }
        
        .element-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-left: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .example-data {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 5px;
        }
        
        .copy-icon {
            margin-left: 10px;
            cursor: pointer;
            color: #4a8cff;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>角色注册器</h1>
            <p class="subtitle">输入角色相关信息，一键生成符合格式的文本内容。生成的文本将分别显示在独立文本框中，便于复制使用。</p>
        </header>
        
        <div class="main-content">
            <div class="input-section">
                <h2 class="section-title">角色信息输入</h2>
                
                <div class="input-grid">
                    <div class="form-group">
                        <label for="name">【名】<span class="element-badge">必填</span></label>
                        <input type="text" id="name" placeholder="例如：钟离">
                        <p class="example-data">角色的名字</p>
                    </div>
                    
                    <div class="form-group">
                        <label for="family">【家族】</label>
                        <input type="text" id="family" placeholder="例如：往生堂">
                        <p class="example-data">角色的家族或组织</p>
                    </div>
                    
                    <div class="form-group">
                        <label for="title">【称号】</label>
                        <input type="text" id="title" placeholder="例如：尘世闲游">
                        <p class="example-data">角色的称号</p>
                    </div>
                    
                    <div class="form-group">
                        <label for="element">【元素】<span class="element-badge">必填</span></label>
                        <select id="element">
                            <option value="geo">geo</option>
                            <option value="anemo">anemo</option>
                            <option value="electro">electro</option>
                            <option value="dendro">dendro</option>
                            <option value="hydro">hydro</option>
                            <option value="pyro">pyro</option>
                            <option value="cryo">cryo</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="code">【代码】<span class="element-badge">必填</span></label>
                        <input type="text" id="code" placeholder="例如：zhongli">
                        <p class="example-data">角色的唯一标识符</p>
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">【性别】<span class="element-badge">必填</span></label>
                        <select id="gender">
                            <option value="male">male</option>
                            <option value="female">female</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="age">【年龄】</label>
                        <input type="number" id="age" placeholder="12/16/20" min="1" value="16">
                    </div>
                    
                    <div class="form-group">
                        <label for="firstMeet">【初次见面】</label>
                        <textarea id="firstMeet" placeholder="初次见面的描述..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="joinTeam">【加入队伍】</label>
                        <textarea id="joinTeam" placeholder="加入队伍的说明..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="shock">【冲击】</label>
                        <input type="number" id="shock" placeholder="1-20" min="1" max="20" value="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="fire">【火力】</label>
                        <input type="number" id="fire" placeholder="1-20" min="1" max="20" value="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="maneuver">【机动】</label>
                        <input type="number" id="maneuver" placeholder="1-20" min="1" max="20" value="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="siege">【围城】</label>
                        <input type="number" id="siege" placeholder="1-20" min="1" max="20" value="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="generalTrait">【将领特质】</label>
                        <textarea id="generalTrait" placeholder="将领特质描述..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="roleBreakthrough">【角色突破】</label>
                        <textarea id="roleBreakthrough" placeholder="角色突破描述..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="wantToKnow">【想要了解】</label>
                        <textarea id="wantToKnow" placeholder="想要了解的内容..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="admin">【行政】</label>
                        <input type="number" id="admin" placeholder="1-6" min="1" max="6" value="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="diplomacy">【外交】</label>
                        <input type="number" id="diplomacy" placeholder="1-6" min="1" max="6" value="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="military">【军事】</label>
                        <input type="number" id="military" placeholder="1-6" min="1" max="6" value="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="trait">【特质】</label>
                        <textarea id="trait" placeholder="特质描述..."></textarea>
                    </div>
                </div>
                
                <div class="btn-container">
                    <button class="generate-btn" onclick="generateTexts()">生成角色文本</button>
                </div>
            </div>
            
            <div class="output-section">
                <h2 class="section-title">生成结果</h2>
                
                <div class="output-container">
                    <div class="output-group">
                        <div class="output-title">将领本地化</div>
                        <textarea class="output-text" id="output1" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">配偶本地化</div>
                        <textarea class="output-text" id="output2" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">顾问本地化</div>
                        <textarea class="output-text" id="output3" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">顾问选项</div>
                        <textarea class="output-text" id="output4" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">配偶选项</div>
                        <textarea class="output-text" id="output5" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">将领判断</div>
                        <textarea class="output-text" id="output6" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">将领召唤</div>
                        <textarea class="output-text" id="output7" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">顾问定义</div>
                        <textarea class="output-text" id="output8" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">将领特质定义</div>
                        <textarea class="output-text" id="output9" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">配偶特质定义</div>
                        <textarea class="output-text" id="output10" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">修正</div>
                        <textarea class="output-text" id="output11" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">顾问图像</div>
                        <textarea class="output-text" id="output12" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title">将领图像</div>
                        <textarea class="output-text" id="output13" readonly></textarea>
                    </div>
                    
                    <div class="output-group">
                        <div class="output-title warning-title">提醒！</div>
                        <textarea class="output-text warning" id="output14" readonly>不要忘记在scripted_triggers中填写角色！！！不要忘记填写修正！！！</textarea>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>角色注册器 v1.0 | 生成符合格式的角色定义文本</p>
        </footer>
    </div>

    <script>
        function generateTexts() {
            // 获取输入值
            const name = document.getElementById('name').value || '名';
            const family = document.getElementById('family').value || '家族';
            const title = document.getElementById('title').value || '称号';
            const element = document.getElementById('element').value;
            const code = document.getElementById('code').value || 'code';
            const gender = document.getElementById('gender').value;
            const age = document.getElementById('age').value || '年龄';
            const firstMeet = document.getElementById('firstMeet').value || '初次见面';
            const joinTeam = document.getElementById('joinTeam').value || '加入队伍';
            const shock = document.getElementById('shock').value || '冲击';
            const fire = document.getElementById('fire').value || '火力';
            const maneuver = document.getElementById('maneuver').value || '机动';
            const siege = document.getElementById('siege').value || '围城';
            const generalTrait = document.getElementById('generalTrait').value || '将领特质';
            const roleBreakthrough = document.getElementById('roleBreakthrough').value || '角色突破';
            const wantToKnow = document.getElementById('wantToKnow').value || '想要了解';
            const admin = document.getElementById('admin').value || '行政';
            const diplomacy = document.getElementById('diplomacy').value || '外交';
            const military = document.getElementById('military').value || '军事';
            const trait = document.getElementById('trait').value || '特质';
            
            // 生成各个部分的文本
            const part1 = `gs_leader_${code}:0 "£${element}£ ${name}"
desc_gs_leader_${code}:0 "${firstMeet}\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n£gs_leader_${code}_tooltip_pic£\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n"
gs_leader_${code}_personality:0 "£${element}£${generalTrait}\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n£gs_leader_${code}_tooltip_pic£\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n${joinTeam}"`;
            
            const part2 = `gs_peiou_${code}_personality:0 "£${element}£${trait}"
desc_gs_peiou_${code}_personality:0 "£${element}£${trait}\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n£gs_leader_${code}_tooltip_pic£\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n${wantToKnow}"`;
            
            const part3 = `gs_advisor_${code}:0 "£${element}£ ${name}"
gs_advisor_${code}_desc:0 "£${element}£ ${name}\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n£gs_leader_${code}_tooltip_pic£\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n${roleBreakthrough}"`;
            
            const part4 = `    option = {
        name = gs_yuanshenadvisor_events.10.${code}
        trigger = {
            has_country_modifier = gs_leader_${code}
        }

        if = {
            limit = {
                has_country_flag = gs_yuanshenadvisor_1_flag
            }
            add_years_of_income = -0.01
            define_advisor = {
                type = gs_advisor_${code}
                name = "£${element}£ ${name}"
                skill = 1
                #age = ${age}
                cost_multiplier = 0.25
                ${gender} = yes
            }
        }
        if = {
            limit = {
                has_country_flag = gs_yuanshenadvisor_2_flag
            }
            add_years_of_income = -0.04
            define_advisor = {
                type = gs_advisor_${code}
                name = "£${element}£ ${name}"
                skill = 2
                #age = ${age}
                cost_multiplier = 0.25
                ${gender} = yes
            }
        }
        if = {
            limit = {
                has_country_flag = gs_yuanshenadvisor_3_flag
            }
            add_years_of_income = -0.09
            define_advisor = {
                type = gs_advisor_${code}
                name = "£${element}£ ${name}"
                skill = 3
                #age = ${age}
                cost_multiplier = 0.25
                ${gender} = yes
            }
        }
        custom_tooltip = gs_advisor_${code}_desc
    }`;
            
            const part5 = `    option = {
        name = gs_yuanshenpeiou_events.10.a
        trigger = {
            has_country_modifier = gs_leader_${code}
        }
        define_consort = {
            name = "£${element}£ ${name}"
            dynasty = "${family}"
            #age = ${age}
            adm = ${admin}
            dip = ${diplomacy}
            mil = ${military}
            ${gender} = yes
        }
        hidden_effect = {
            add_queen_personality = gs_peiou_${code}_personality
        }
        custom_tooltip = desc_gs_peiou_${code}_personality
    }`;
            
            const part6 = `                AND = {
                    has_country_modifier = gs_leader_${code}
                    NOT = { has_leader = "£${element}£ ${name} ${family} 「${title}」" }
                }`;
            
            const part7 = `            if = {
                limit = {
                    has_country_modifier = gs_leader_${code}
                    NOT = { has_leader = "£${element}£ ${name} ${family} 「${title}」" }
                }
                define_general = {
                    shock = ${shock}
                    fire = ${fire}
                    manuever = ${maneuver}
                    siege = ${siege}
                    name = "£${element}£ ${name} ${family} 「${title}」"
                    ${gender} = yes
                    trait = gs_leader_${code}_personality
                }
                custom_tooltip = gs_leader_${code}_personality
            }`;
            
            const part8 = `gs_advisor_${code} = { #${name}
    monarch_power = ADM
    allow_only_${gender} = yes
    
    
    skill_scaled_modifier = {
        modifier = {
            meritocracy = 0.5
        }
    }
    chance = { factor = 0 }
    ai_will_do = { factor = 0 }
}`;
            
            const part9 = `#${name} ${family} 「${title}」-${generalTrait}
gs_leader_${code}_personality = {
    allow = { always = no }
    
}`;
            
            const part10 = `gs_peiou_${code}_personality = {#${name}
    allow = { always = no }
    
    chance = {
        modifier = {
            factor = -2
        }
    }

    #修正
    
}`;
            
            const part11 = `gs_leader_${code} = {
    free_leader_pool = 1
    estate_genshin_influence_modifier = 0.01
    estate_genshin_loyalty_modifier =  0.01
}`;
            
            const part12 = `    spriteType = {
        name = "GFX_advisor_gs_advisor_${code}"
        texturefile = "gfx//interface//advisors//gs_advisor_${code}.dds"
        noOfFrames = 1
        norefcount = yes
        effectFile = "gfx/FX/buttonstate.lua"
        loadType = "INGAME"
    }`;
            
            const part13 = `    spriteType = { #${name}
        name = "GFX_text_gs_leader_${code}_tooltip_pic"
        texturefile = "gfx/interface/leader/gs_leader_${code}_pic.png"
        legacy_lazy_load = no
    }`;
            
            const part14 = `**不要忘记在triggered_modifiers中填写角色！！！不要忘记填写修正！！！**`;
            
            // 设置输出文本
            document.getElementById('output1').value = part1;
            document.getElementById('output2').value = part2;
            document.getElementById('output3').value = part3;
            document.getElementById('output4').value = part4;
            document.getElementById('output5').value = part5;
            document.getElementById('output6').value = part6;
            document.getElementById('output7').value = part7;
            document.getElementById('output8').value = part8;
            document.getElementById('output9').value = part9;
            document.getElementById('output10').value = part10;
            document.getElementById('output11').value = part11;
            document.getElementById('output12').value = part12;
            document.getElementById('output13').value = part13;
            document.getElementById('output14').value = part14;
        }
        
        // 初始化示例数据
        window.onload = function() {
            document.getElementById('name').value = '芙宁娜';
            document.getElementById('family').value = '德 枫丹';
            document.getElementById('title').value = '永世领唱，无尽圆舞';
            document.getElementById('code').value = 'funingna';
            document.getElementById('firstMeet').value = '呆站在那里做什么？该不会是因为过于激动，说不出话了吧？没错，站在你面前的就是枫丹人人皆知的大明星——芙宁娜哦。我的档期可是很紧的，能约到我，说明你运气不错嘛。';
            document.getElementById('joinTeam').value = '果然还是离不开我啊。';
            document.getElementById('roleBreakthrough').value = '没想到你会对我的事这么上心，这是否意味着你仍然需要我的「力量」呢？然而如今的我…或许无法给你足够的回报…你说看重的是我「本人」？既然这样，就让你我共同出演我们的未来吧。';
            document.getElementById('wantToKnow').value = '人们很喜欢谈论过去，为那些逝去的美好感到惋惜；也很喜欢谈论未来，仿佛为了缥缈的明天可以牺牲一切。我并不认同他们的做法，但也感到非常羡慕：因为我曾经生活在既没有过去、也没有未来的世界里。为了应对那种恐慌，我尝试塑造并扮演了一个更坚强、更像神明的自己，几百年的时间过去，我曾扮演的「形象」逐渐与真实的自己融为一体。如今连我也无法分辨…或许也没有分辨的必要了，过去的种种经历组成了现在的我，那场并不完美的演出也是我最重要的一部分啊。';
        };
    </script>
</body>
</html>
